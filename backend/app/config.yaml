  max_backups: 10
  max_age: 30 #单位天
  compress: true
static:
  root_path: /var/lib/static
  avatars_path: /var/lib/static/avatars
  backimage_path: /var/lib/static/backimages
  post_path: /var/lib/static/posts
  book_path: /var/lib/static/books
auth:
  max_age: 240 #单位小时
cache:
  read_expiration: 30 #单位秒
  write_expiration: 30 #单位秒