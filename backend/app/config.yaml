server:
  address: "localhost:8080"
  port: 8080
  timeout: 30s
mysql:
  host: "mysql"
  port: 3306
  db: goodminton_db
  credentials:
    username: "root"
    password: "root123123"
  connmaxlifetime: 1
  maxopenconns: 100
  maxidleconns: 10
redis:
  addr: "redis:6379"
  db: 0
  poolsize: 100
  cookie_expire: 240
  like_expire: 168 #hour
hfut-api:
  host: "hfut-api"
  port: 8082
